# COMPAT (JDK 18+) keeps the daemon on the platform charset. Gradle writes the test
# worker classpath (@argfile) in that charset and java.exe reads it the same way, so a
# non-ASCII project path such as "Programação" no longer hides the test classes.
# Sources stay UTF-8 because every JavaCompile task sets its encoding explicitly.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=COMPAT
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.parallel=true


# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Caminho do projeto contém acentos (Programação)
android.overridePathCheck=true
